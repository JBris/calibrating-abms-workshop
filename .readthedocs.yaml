version: 2

build:
  os: ubuntu-22.04
  tools:
    python: "3.11"
  jobs:
    pre_install:
      - git update-index --assume-unchanged docs/source/conf.py
    post_install:
      - pip install poetry
      - poetry config virtualenvs.create false
      - poetry install --no-interaction

sphinx:
  configuration: docs/source/conf.py
  fail_on_warning: false

formats:
  - pdf
  - epub
  - htmlzip
